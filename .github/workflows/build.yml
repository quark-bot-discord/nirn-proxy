name: Build and Push Docker Image

# Builds ghcr.io/quark-bot-discord/nirn-proxy and, on `main`, deploys it.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

# One run on `main` at a time, in push order. Two builds side by side could
# finish out of order and leave the older image under the tag, and so in the
# cluster. Any other ref is a group of its own.
concurrency:
  group: build-${{ github.ref == 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/quark-bot-discord/nirn-proxy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests build only. Their token cannot push anyway.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:main` is what quark-k8s runs. `:sha-<short>` is kept for rolling back
      # by hand; `vX.Y.Z` tags get their own tag.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Put the image that was just pushed into service.
  #
  # Every proxy pulls `:main` with `imagePullPolicy: Always`, so a restart is
  # the deploy. The runner is a pod in the cluster; kubectl picks up its
  # service account, which may restart these and nothing else
  # (quark-k8s: app-services/ci-deploy-rbac.yaml).
  #
  # One at a time, pro first, so a build that does not start stops at
  # pro-proxy and leaves main and the webhook proxies on the old one. The
  # webhook proxies are single-replica StatefulSets on hostNetwork: each
  # restart stops the old pod before starting the new one, and nirn-proxy
  # drains its queues on SIGTERM within the 30s grace period.
  #
  # To push without deploying, put [skip deploy] in the message of the last
  # commit pushed. For a pull request merged with a merge commit that message
  # includes the PR's title, so put it there. It covers that push only, and
  # the image is still built and pushed: any pod that starts afterwards runs
  # it, and the next push deploys it.
  deploy:
    name: Deploy
    needs: build
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: self-hosted
    timeout-minutes: 45

    env:
      NAMESPACE: app-services
      IMAGE: ghcr.io/quark-bot-discord/nirn-proxy:main
      # kind/name, in restart order
      WORKLOADS: >-
        deployment/pro-proxy
        deployment/main-proxy
        statefulset/webhook-proxy-0
        statefulset/webhook-proxy-1
        statefulset/webhook-proxy-2

    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # Until the quark-k8s manifests are applied the proxies still run the
      # upstream image, and a restart would deploy nothing. Fail before
      # touching anything.
      - name: Check every proxy runs this image
        run: |
          set -euo pipefail
          bad=0
          for w in $WORKLOADS; do
            img=$(kubectl -n "$NAMESPACE" get "$w" -o jsonpath='{.spec.template.spec.containers[0].image}')
            if [ "$img" != "$IMAGE" ]; then
              echo "::error::$w runs $img, not $IMAGE. Apply the quark-k8s proxy manifests first."
              bad=1
            fi
          done
          exit $bad

      - name: Restart and wait
        run: |
          set -euo pipefail
          for w in $WORKLOADS; do
            kubectl -n "$NAMESPACE" rollout restart "$w"
            kubectl -n "$NAMESPACE" rollout status "$w" --timeout=5m
            echo "\`$w\` restarted and rolled out." >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Show the pods
        if: always()
        run: |
          for w in $WORKLOADS; do
            kubectl -n "$NAMESPACE" get pods -l "app=${w#*/}" -o wide || true
          done
