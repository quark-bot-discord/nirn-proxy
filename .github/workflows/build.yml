name: Build and Push Docker Image

# Builds ghcr.io/quark-bot-discord/nirn-proxy and, on `main`, deploys it.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

# A newer run for the same pull request or branch cancels this one. Pushes to
# main/development are queued instead, so a deploy or digest pin is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development') }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/quark-bot-discord/nirn-proxy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    # Registry credentials are secrets of the `registry` environment, which
    # only main and development can use (quark-k8s digest/registry plan).
    environment: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && 'registry' || '' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests build only. Their token cannot push anyway.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # `:main` is what quark-k8s runs. `:sha-<short>` is kept for rolling back
      # by hand; `vX.Y.Z` tags get their own tag.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin the image just pushed in quark-k8s (scripts/bump-digest.sh); Argo CD
      # rolls it out. Only main and development, with the registry environment.
      - name: Get a quark-k8s token
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        id: digest-bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.DIGEST_BOT_APP_ID }}
          private-key: ${{ secrets.DIGEST_BOT_PRIVATE_KEY }}
          owner: quark-bot-discord
          repositories: quark-k8s

      - name: Pin the image in quark-k8s
        # `[skip deploy]` in the last commit's message still means "push but don't
        # put it into service": the manifests keep the digest they have.
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && !contains(github.event.head_commit.message, '[skip deploy]')
        env:
          GH_TOKEN: ${{ steps.digest-bot.outputs.token }}
          IMAGES: ${{ fromJSON(steps.build.outputs.metadata || '{}')['image.name'] }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git clone -q --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/quark-bot-discord/quark-k8s" "$RUNNER_TEMP/quark-k8s"
          "$RUNNER_TEMP/quark-k8s/scripts/bump-digest.sh" "$IMAGES" "$DIGEST"
